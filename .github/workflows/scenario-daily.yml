# Daily scenario probabilities (method market-anchored-v1) into the scenario registry.
# Deterministic: public Polymarket Gamma + Kalshi v2 endpoints -> fixed rule -> scenario_runs /
# scenario_daily -> rpc scenario_publish_run -> rpc scenario_lifecycle_tick. NO model / AI API.
# Never writes scenario_probabilities (derived by the registry's sync trigger).
# Runs at 05:20 UTC, before the 06:51 Cairo Claude daily-build task.
name: Scenario Daily (market-anchored-v1)
# The run title marks dry runs, so schedule_gate.sh never counts a dry run as today's real run.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'Scenario Daily (dry run)' || 'Scenario Daily (market-anchored-v1)' }}

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: fetch + compute + print what would be written; write nothing'
        type: boolean
        default: false

concurrency:
  group: scenario-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fallback gate (WS4): this workflow is dispatched on time by the Cloudflare scheduler Worker
  # (workers/scheduler). The GitHub schedule above stays as a fallback; a late scheduled run is
  # skipped when a dispatched run already covered today (UTC).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/workflows/scripts
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/scripts/schedule_gate.sh scenario-daily.yml utc-day

  scenario:
    needs: gate
    # Fail open like the gate script: only an explicit run=false skips (a failed gate job does not).
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCRIPT: .github/workflows/scripts/scenario_daily.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Unit tests (method parity with Day 221 + guards)
        working-directory: .github/workflows/scripts
        run: python -m unittest tests.test_scenario_daily

      - name: Name the evidence artifact (DAY LOCK, UTC)
        id: name
        run: |
          DAY=$(python -c "import datetime as d; print((d.datetime.now(d.timezone.utc).date() - d.date(2026, 2, 28)).days + 1)")
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "artifact=scenario-evidence-day-${DAY}-run${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Fetch raw market JSON (Polymarket Gamma, Kalshi v2)
        run: python "$SCRIPT" fetch --out evidence

      # Uploaded BEFORE any database write, so the artifact named in evidence_ref exists.
      - name: Upload raw market evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

      - name: Compute and publish (or dry run)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          ARGS=(run --evidence evidence --artifact-name "${{ steps.name.outputs.artifact }}" --day "${{ steps.name.outputs.day }}")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python "$SCRIPT" "${ARGS[@]}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::${{ github.workflow }} FAILED — check logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
