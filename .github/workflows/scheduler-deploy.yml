# Deploys the cron dispatcher Worker (workers/scheduler, "mena-intel-scheduler") — separate from the
# site deploy (deploy.yml). It only runs when the scheduler code changes or on demand, and it ends
# green with a ::notice:: when its secrets are not configured yet (nothing is deployed then).
# Secrets reach the Worker with `wrangler deploy --secrets-file` in the same deployment (wrangler
# keeps secrets from earlier deployments; values never touch the repo or the log).
# Free plan: 1 more Worker (100 per account), 2 of the account's 5 Cron Triggers.
name: Deploy Scheduler Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/scheduler/**'
      - '.github/workflows/scheduler-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scheduler
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check secrets (skip with a notice when not configured)
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GH_DISPATCH_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Scheduler not deployed::Missing secret(s):$missing. The GitHub schedules keep running as before."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Install dependencies (lockfile-exact; wrangler pinned in package.json)
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Deploy mena-intel-scheduler with its secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          umask 077
          f="$RUNNER_TEMP/scheduler-secrets.json"
          # Optional Telegram secrets are included only when set (JSON built by python: no quoting bugs).
          python3 - "$f" <<'PY'
          import json, os, sys
          keys = ["GH_DISPATCH_TOKEN", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]
          json.dump({k: os.environ[k] for k in keys if os.environ.get(k)}, open(sys.argv[1], "w"))
          PY
          npx wrangler deploy --config workers/scheduler/wrangler.jsonc --secrets-file "$f"
          rm -f "$f"
          {
            echo "Scheduler deployed. Crons (UTC): */30 * * * * (collect-markets; + collect-articles at :00), 20 5 * * * (scenario-daily)."
            echo "Cron changes can take up to 15 minutes to propagate."
          } >> "$GITHUB_STEP_SUMMARY"
