# Phase 11 audit (2026-03): This workflow is the "markets" data collector.
# - Writes to: market_data (Supabase). Does NOT write to nai_scores, country_reports, disinformation_tracker.
# - Does NOT duplicate daily_pipeline.yml Stage 1 (Perplexity fetch). Keep running.
name: Collect Market Data

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 min (optimized from 15 min)
  workflow_dispatch:

jobs:
  # Fallback gate (WS4): this workflow is dispatched on time by the Cloudflare scheduler Worker
  # (workers/scheduler). The GitHub schedule above stays as a fallback; a late scheduled run is
  # skipped when a dispatched run already covered the last 25 minutes.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/workflows/scripts
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/scripts/schedule_gate.sh collect-markets.yml 25

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .github/workflows/scripts/requirements.txt

      - name: Run market data collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/workflows/scripts/collect_markets.py

      - name: Warm Cloudflare KV cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/workflows/scripts/warm_kv_cache.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::${{ github.workflow }} FAILED — check logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
